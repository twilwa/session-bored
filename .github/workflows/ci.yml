# ABOUTME: Validates Greenroom changes and deploys passing main commits to production.
# ABOUTME: Cancels superseded pull request runs while serializing production releases.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run browser tests
        env:
          WRANGLER_LOG_PATH: .wrangler/ci-logs
        run: node scripts/run-browser-tests.js

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Wrangler diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-browser-logs
          path: .wrangler/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs:
      - checks
      - browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://session-bored.techwilliams-warren.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate production database
        run: npm run db:migrate:remote

      - name: Deploy production Worker
        run: npm run deploy

      - name: Verify production health
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors "$PRODUCTION_URL" > /dev/null
